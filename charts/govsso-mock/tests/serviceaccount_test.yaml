# charts/govsso-mock/tests/serviceaccount_test.yaml
suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: creates a ServiceAccount when enabled
    set:
      image.repository: testrepo
      image.tag: "1.0"
      tls.existingSecret: test-tls
      idToken.existingSecret: test-id
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      # helm-unittest injects "RELEASE-NAME" which common.names.fullname lowercases to "release-name"
      - equal:
          path: metadata.name
          value: release-name-govsso-mock

  - it: renders no resources when disabled
    set:
      image.repository: testrepo
      image.tag: "1.0"
      tls.existingSecret: test-tls
      idToken.existingSecret: test-id
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses custom name when provided
    set:
      image.repository: testrepo
      image.tag: "1.0"
      tls.existingSecret: test-tls
      idToken.existingSecret: test-id
      serviceAccount.create: true
      serviceAccount.name: my-sa
    asserts:
      - equal:
          path: metadata.name
          value: my-sa
