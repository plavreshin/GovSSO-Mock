{{/* charts/govsso-mock/templates/serviceaccount.yaml */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "govsso-mock.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "govsso-mock.labels" . | nindent 4 }}
  {{- $annotations := merge (default dict .Values.serviceAccount.annotations) (default dict .Values.commonAnnotations) }}
  {{- if $annotations }}
  annotations: {{- toYaml $annotations | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
